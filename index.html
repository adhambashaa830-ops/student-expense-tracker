<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }

        .budget-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .budget-display > div {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-left: 5px solid #cbd5e1;
        }

        .budget-display > div:nth-child(1) { border-left-color: var(--primary); }
        .budget-display > div:nth-child(2) { border-left-color: var(--danger); }
        .budget-display > div:nth-child(3) { border-left-color: var(--success); }

        .budget-display h4 {
            margin: 0 0 10px 0;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            color: #64748b;
        }

        .budget-display h1 {
            margin: 0;
            font-size: 24px;
        }

        .form-container, .history-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
        }

        @media (max-width: 600px) {
            form { grid-template-columns: 1fr; }
        }

        input, select, button {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            margin-bottom: 8px;
            border-radius: 6px;
            border-right: 4px solid #cbd5e1;
        }

        .delete-btn {
            background: none;
            color: var(--danger);
            border: none;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎒 Student Expense Tracker</h2>
        
        <div class="budget-display">
            <div>
                <h4>Total Monthly Budget</h4>
                <h1 id="budget-amount">$500.00</h1>
            </div>
            <div>
                <h4>Total Expenses</h4>
                <h1 id="expense-amount" style="color: red;">$0.00</h1>
            </div>
            <div>
                <h4>Remaining Balance</h4>
                <h1 id="balance-amount" style="color: green;">$500.00</h1>
            </div>
        </div> 
        <div class="form-container">
            <h3>Add New Expense</h3>
            <form id="expense-form" onsubmit="addNewExpense(event)">
                <input type="text" id="expense-name" placeholder="e.g., Books, Lunch, Rent" required>
                <input type="number" id="expense-cost" placeholder="Amount ($)" required min="0.01" step="0.01">
                <select id="expense-category">
                    <option value="Food">Food & Drinks</option>
                    <option value="Education">Books & College Supplies</option>
                    <option value="Transport">Bus/Train/Fuel</option>
                    <option value="Entertainment">Fun & Outings</option>
                </select>
                <button type="submit">Add Expense</button>
            </form>
        </div>

        <div class="history-container">
            <h3>Expense Log History</h3>
            <ul id="expense-list">
                <li style="color: #64748b; justify-content: center;">No expenses recorded yet.</li>
            </ul>
        </div>
    </div>

    <script>
        let totalBudget = 500.00;
        let expenses = [];

        const budgetAmountEl = document.getElementById('budget-amount');
        const expenseAmountEl = document.getElementById('expense-amount');
        const balanceAmountEl = document.getElementById('balance-amount');
        const expenseForm = document.getElementById('expense-form');
        const expenseNameInput = document.getElementById('expense-name');
        const expenseCostInput = document.getElementById('expense-cost');
        const expenseCategoryInput = document.getElementById('expense-category');
        const expenseListEl = document.getElementById('expense-list');

        function updateDashboardValues() {
            const totalSpent = expenses.reduce((sum, item) => sum + item.cost, 0);
            const remainingBalance = totalBudget - totalSpent;

            budgetAmountEl.innerText = $${totalBudget.toFixed(2)};
            expenseAmountEl.innerText = $${totalSpent.toFixed(2)};
            balanceAmountEl.innerText = $${remainingBalance.toFixed(2)};

            if (remainingBalance < 0) {
                balanceAmountEl.style.color = 'var(--danger)';
            } else {
                balanceAmountEl.style.color = 'var(--success)';
            }
        }

        function renderExpenseList() {
            expenseListEl.innerHTML = '';

            if (expenses.length === 0) {
                expenseListEl.innerHTML = '<li style="color: #64748b; justify-content: center;">No expenses recorded yet.</li>';
                return;
            }

            expenses.forEach((item, index) => {
                const li = document.createElement('li');
                
                if (item.category === 'Food') li.style.borderRightColor = '#f59e0b';
                if (item.category === 'Education') li.style.borderRightColor = '#3b82f6';
                if (item.category === 'Transport') li.style.borderRightColor = '#10b981';
                if (item.category === 'Entertainment') li.style.borderRightColor = '#ec4899';

                li.innerHTML = 
                    <div>
                        <strong>${item.name}</strong> 
                        <span style="font-size: 11px; padding: 2px 6px; margin-left: 5px; border-radius: 12px; background: #e2e8f0;">${item.category}</span>
                    </div>
                    <div>
                        <span style="font-weight: 600; margin-right: 15px;">-$${item.cost.toFixed(2)}</span>
                        <button type="button" class="delete-btn" onclick="deleteExpense(${index})">×</button>
                    </div>
                ;
                expenseListEl.appendChild(li);
            });
        }

        window.addNewExpense = function(e) {
            e.preventDefault();

            const name = expenseNameInput.value.trim();
            const cost = parseFloat(expenseCostInput.value);
            const category = expenseCategoryInput.value; 
            if (name === ''  isNaN(cost)  cost <= 0) return;

            expenses.push({ name, cost, category });

            expenseNameInput.value = '';
            expenseCostInput.value = '';

            updateDashboardValues();
            renderExpenseList();
        };

        window.deleteExpense = function(index) {
            expenses.splice(index, 1);
            updateDashboardValues();
            renderExpenseList();
        };
    </script>
</body>
</html>
