<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }

        .budget-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .budget-display > div {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-left: 5px solid #cbd5e1;
        }

        .budget-display > div:nth-child(1) { border-left-color: var(--primary); }
        .budget-display > div:nth-child(2) { border-left-color: var(--danger); }
        .budget-display > div:nth-child(3) { border-left-color: var(--success); }

        .budget-display h4 {
            margin: 0 0 10px 0;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            color: #64748b;
        }

        .budget-display h1 {
            margin: 0;
            font-size: 24px;
        }

        .form-container, .history-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
        }

        @media (max-width: 600px) {
            form { grid-template-columns: 1fr; }
        }

        input, select, button {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            margin-bottom: 8px;
            border-radius: 6px;
            border-right: 4px solid #cbd5e1;
        }

        .delete-btn {
            background: none;
            color: var(--danger);
            border: none;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎒 Student Expense Tracker</h2>
        
        <div class="budget-display">
            <div>
              <script>
        // Set app state variables
        let budgetTotal = 500.00;
        let itemLogs = [];

        // Catch DOM display elements
        const budgetDisplayField = document.getElementById('budget-amount');
        const expenseDisplayField = document.getElementById('expense-amount');
        const balanceDisplayField = document.getElementById('balance-amount');
        const trackingForm = document.getElementById('expense-form');
        const inputNameField = document.getElementById('expense-name');
        const inputCostField = document.getElementById('expense-cost');
        const inputCategoryField = document.getElementById('expense-category');
        const historyLogList = document.getElementById('expense-list');

        // Math compilation function
        function recalculateDashboard() {
            let spentSum = 0;
            for (let i = 0; i < itemLogs.length; i++) {
                spentSum += itemLogs[i].cost;
            }
            const leftover = budgetTotal - spentSum;

            budgetDisplayField.innerText = `$${budgetTotal.toFixed(2)}`;
            expenseDisplayField.innerText = `$${spentSum.toFixed(2)}`;
            balanceDisplayField.innerText = `$${leftover.toFixed(2)}`;

            if (leftover < 0) {
                balanceDisplayField.style.color = 'var(--danger)';
            } else {
                balanceDisplayField.style.color = 'var(--success)';
            }
        }

        // List rendering function
        function drawUIList() {
            historyLogList.innerHTML = '';

            if (itemLogs.length === 0) {
                historyLogList.innerHTML = '<li style="color: #64748b; justify-content: center;">No expenses recorded yet.</li>';
                return;
            }

            itemLogs.forEach((element, pos) => {
                const row = document.createElement('li');
                
                if (element.category === 'Food') row.style.borderRightColor = '#f59e0b';
                if (element.category === 'Education') row.style.borderRightColor = '#3b82f6';
                if (element.category === 'Transport') row.style.borderRightColor = '#10b981';
                if (element.category === 'Entertainment') row.style.borderRightColor = '#ec4899';

                row.innerHTML = `
                    <div>
                        <strong>${element.name}</strong> 
                        <span style="font-size: 11px; padding: 2px 6px; margin-left: 5px; border-radius: 12px; background: #e2e8f0;">${element.category}</span>
                    </div>
                    <div>
                        <span style="font-weight: 600; margin-right: 15px;">-$${element.cost.toFixed(2)}</span>
                        <button type="button" class="delete-btn" onclick="removeLoggedItem(${pos})">×</button>
                    </div>
                `;
                historyLogList.appendChild(row);
            });
        }

        // Form submission capture
        trackingForm.onsubmit = function(event) {
            event.preventDefault();

            const taskTitle = inputNameField.value.trim();
            const numericCost = parseFloat(inputCostField.value);
            const tagValue = inputCategoryField.value;

            if (taskTitle === '' || isNaN(numericCost) || numericCost <= 0) return;

            itemLogs.push({ name: taskTitle, cost: numericCost, category: tagValue });

            inputNameField.value = '';
            inputCostField.value = '';

            recalculateDashboard();
            drawUIList();
        };

        // Deletion handling function
        window.removeLoggedItem = function(pos) {
            itemLogs.splice(pos, 1);
            recalculateDashboard();
            drawUIList();
        };

        // Initial launch configuration load
        recalculateDashboard();
    </script>
</body>
</html>
