<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title> 
    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }

        .budget-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .budget-display > div {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-left: 5px solid #cbd5e1;
        }

        .budget-display > div:nth-child(1) { border-left-color: var(--primary); }
        .budget-display > div:nth-child(2) { border-left-color: var(--danger); }
        .budget-display > div:nth-child(3) { border-left-color: var(--success); }

        .budget-display h4 {
            margin: 0 0 10px 0;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            color: #64748b;
        }

        .budget-display h1 {
            margin: 0;
            font-size: 24px;
        }

        .form-container, .history-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
        }

        @media (max-width: 600px) {
            form { grid-template-columns: 1fr; }
        }

        input, select, button {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4338ca;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            margin-bottom: 8px;
            border-radius: 6px;
            border-right: 4px solid #cbd5e1;
        }

        .delete-btn {
            background: none;
            color: var(--danger);
            border: none;
            padding: 0 5px;
            font-size: 18px;
            cursor: pointer;
        }
        
        .delete-btn:hover {
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎒 Student Expense Tracker</h2>
        
        <!-- Budget Display Boxes -->
        <div class="budget-display">
            <div>
                <h4>Total Monthly Budget</h4>
                <h1 id="budget-amount">$0.00</h1>
            </div>
            <div>
                <h4>Total Expenses</h4>
                <h1 id="expense-amount" style="color: red;">$0.00</h1>
            </div>
            <div>
                <h4>Remaining Balance</h4>
                <h1 id="balance-amount" style="color: green;">$0.00</h1>
            </div>
        </div>

        <!-- Input Form -->
        <div class="form-container">
            <h3>Add New Expense</h3>
            <form id="expense-form">
                <input type="text" id="expense-name" placeholder="e.g., Books, Lunch, Rent" required>
                <input type="number" id="expense-cost" placeholder="Amount ($)" required min="0.01" step="0.01">
                <select id="expense-category">
                    <option value="Food">Food & Drinks</option>
                    <option value="Education">Books & College Supplies</option>
                    <option value="Transport">Bus/Train/Fuel</option>
                    <option value="Entertainment">Fun & Outings</option>
                </select>
                <button type="submit">Add Expense</button>
            </form>
        </div>

        <!-- History List -->
        <div class="history-container">
            <h3>Expense Log History</h3>
            <ul id="expense-list">
                <!-- Expenses will appear here automatically via JavaScript -->
            </ul>
        </div>
    </div>
</body>
</html>
