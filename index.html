<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .grid { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
        .card { flex: 1; background: #eee; padding: 15px; border-radius: 5px; text-align: center; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input, select, button { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #4f46e5; color: white; cursor: pointer; border: none; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 10px; background: #f9f9f9; margin-bottom: 5px; border-left: 5px solid #4f46e5; border-radius: 4px; }
        .del-btn { background: none; color: red; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎒 Student Expense Tracker</h2>
        
        <div class="grid">
            <div class="card">
                <h4>Budget</h4>
                <h3 id="b-amt">$500.00</h3>
            </div>
            <div class="card">
                <h4>Expenses</h4>
                <h3 id="e-amt" style="color: red;">$0.00</h3>
            </div>
            <div class="card">
                <h4>Balance</h4>
                <h3 id="bal-amt" style="color: green;">$500.00</h3>
            </div>
        </div>

        <form id="exp-form">
            <input type="text" id="exp-name" placeholder="Item Name (e.g. Books)" required>
            <input type="number" id="exp-cost" placeholder="Amount ($)" required min="0.01" step="0.01">
            <select id="exp-cat">
                <option value="Food">Food</option>
                <option value="Education">Education</option>
                <option value="Transport">Transport</option>
            </select>
            <button type="submit">Add Expense</button>
        </form>

        <h3>History Log</h3>
        <ul id="exp-list"></ul>
    </div>

    <script>
        let budget = 500.00;
        let list = [];

        const form = document.getElementById('exp-form');
        
        function updateUI() {
            let totalSpent = 0;
            for(let i=0; i<list.length; i++) {
                totalSpent += list[i].cost;
            }
            
            document.getElementById('b-amt').innerText = "$" + budget.toFixed(2);
            document.getElementById('e-amt').innerText = "$" + totalSpent.toFixed(2);
            document.getElementById('bal-amt').innerText = "$" + (budget - totalSpent).toFixed(2);

            const listEl = document.getElementById('exp-list');
            listEl.innerHTML = "";
            
            for(let i=0; i<list.length; i++) {
                let li = document.createElement('li');
                li.innerHTML = `
                    <span><b>${list[i].name}</b> (${list[i].cat})</span>
                    <span>-$${list[i].cost.toFixed(2)} <button class="del-btn" onclick="remove(${i})">X</button></span>
                `;
                listEl.appendChild(li);
            }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            let name = document.getElementById('exp-name').value;
            let cost = parseFloat(document.getElementById('exp-cost').value);
            let cat = document.getElementById('exp-cat').value;

            list.push({name: name, cost: cost, cat: cat});
            form.reset();
            updateUI();
        });

        window.remove = function(index) {
            list.splice(index, 1);
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
